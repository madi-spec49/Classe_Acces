<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion à Classe Accès : cours en ligne le week-end</title>
  <meta name="description" content="Connectez-vous à Classe Accès pour suivre vos cours en ligne du samedi et du dimanche, consulter vos présences et votre progression. Simple et rapide." />
  <meta property="og:title" content="Connexion à Classe Accès : cours en ligne le week-end" />
  <meta property="og:description" content="Connectez-vous à Classe Accès pour suivre vos cours en ligne du samedi et du dimanche, consulter vos présences et votre progression. Simple et rapide." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Classe Accès" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
</head>
<body>
  <header class="topnav">
    <nav class="container topnav-inner" aria-label="Navigation principale">
      <a class="brand" href="login.html">
        <img src="logo.svg" alt="" width="32" height="32" />
        <span class="logo">Classe Accès</span>
      </a>
    </nav>
  </header>

  <main class="container">
    <section class="screen is-active">
      <div class="screen-head">
        <p class="eyebrow">Accès à la plateforme</p>
        <h1>Se connecter à Classe Accès</h1>
        <p class="lead">Les cours ont lieu le week-end. Connectez-vous pour retrouver vos cours et votre suivi.</p>
      </div>

      <div class="card" style="max-width: 520px; padding: 28px;">
        <form id="form-login" class="stack">
          <div class="field">
            <label for="login-email">Email</label>
            <input class="input" id="login-email" type="email" required />
          </div>
          <div class="field">
            <label for="login-pass">Mot de passe</label>
            <input class="input" id="login-pass" type="password" required />
          </div>
          <div>
            <button class="btn btn-primary" type="submit" style="width: 100%;">Se connecter</button>
          </div>
        </form>

        <div id="flash"></div>
      </div>
    </section>
  </main>

  <footer class="pagefoot">
    <div class="container row-between">
      <span>© 2026 Classe Accès · Association scolaire</span>
      <span class="meta">Cours le vendredi soir,le samedi et le dimanche</span>
    </div>
  </footer>

  <script>
    const API_URL = "http://127.0.0.1:8000";
    const $ = (id) => document.getElementById(id);
    const flash = $("flash");

    function message(texte, ok = false) {
      flash.innerHTML = "";
      const div = document.createElement("div");
      div.className = "banner" + (ok ? " banner-ok" : "");
      if (!ok) div.style.color = "var(--danger)";
      div.textContent = texte;
      flash.append(div);
    }

    async function envoyer(bouton, url, corps) {
      const texteOriginal = bouton.textContent;
      bouton.disabled = true;
      bouton.textContent = "Envoi…";
      try {
        const response = await fetch(`${API_URL}${url}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(corps),
        });
        const data = await response.json();
        return { ok: response.ok, status: response.status, data };
      } catch (erreur) {
        return { ok: false, status: 0, data: null };
      } finally {
        bouton.disabled = false;
        bouton.textContent = texteOriginal;
      }
    }

    $("form-login").addEventListener("submit", async (event) => {
      event.preventDefault();
      const { ok, status, data } = await envoyer(event.submitter, "/api/auth/login", {
        email: $("login-email").value,
        password: $("login-pass").value,
      });

      if (status === 0) {
        message("Le serveur ne répond pas. Vérifie que l'API tourne.");
        return;
      }
      if (!ok) {
        message("Email ou mot de passe incorrect.");
        return;
      }

      localStorage.setItem("token", data.access_token);
      localStorage.setItem("role", data.user.role);
      const pages = { staff: "staff.html", teacher: "teacher.html", parent: "parent.html" };
      window.location.href = pages[data.user.role] || "courses.html";
    });

  </script>
</body>
</html>
